<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidharth OS — Command Centre</title>
<style>
:root{
  --bg:#F5F7FA;--surface:#fff;--elevated:#fff;--text:#14161c;--muted:#6b7280;--border:#e5e7eb;
  --primary:#6366F1;--secondary:#8B5CF6;--accent:#06B6D4;--success:#22C55E;--warning:#F59E0B;--danger:#EF4444;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0B0D12;--surface:#11151D;--elevated:#171C26;--text:#eceef2;--muted:#9aa1ad;--border:#232838;}
}
:root[data-theme="dark"]{--bg:#0B0D12;--surface:#11151D;--elevated:#171C26;--text:#eceef2;--muted:#9aa1ad;--border:#232838;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;height:100%}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:200px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:1rem;padding:4px 10px 16px}
.brand span{display:block;font-size:.68rem;color:var(--muted);font-weight:400}
.navbtn{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--muted);text-align:left;font-size:.85rem}
.navbtn.active{background:var(--primary);color:#fff}
.navbtn:hover:not(.active){background:var(--elevated);color:var(--text)}
.main{flex:1;min-width:0;padding:20px 24px 90px;max-width:920px;margin:0 auto;width:100%}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.8rem}
h1{font-size:1.4rem;margin:2px 0 2px;letter-spacing:-.01em}
.date{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.metric .n{font-size:1.5rem;font-weight:700}
.metric .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.section{margin-bottom:20px}
.section h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;font-weight:600}
.focus-card{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;padding:18px 20px;border:none}
.focus-card .tag{font-size:.68rem;opacity:.85;letter-spacing:.05em;text-transform:uppercase}
.focus-card h3{margin:6px 0 2px;font-size:1.15rem}
.focus-card p{margin:0 0 12px;opacity:.9;font-size:.85rem}
.focus-card .why{font-size:.72rem;opacity:.75;margin-top:10px}
.focus-empty{color:var(--muted);font-size:.85rem}
.btn{background:#fff;color:var(--primary);border:none;border-radius:8px;padding:7px 14px;font-size:.82rem;font-weight:600}
.task-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-row.done .txt{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary)}
.txt{flex:1;font-size:.87rem}
.pri{font-size:.62rem;padding:2px 7px;border-radius:6px;color:#fff;flex:0 0 auto;text-transform:uppercase}
.pri.urgent{background:var(--danger)}.pri.high{background:var(--warning)}.pri.medium{background:var(--primary)}.pri.low{background:var(--muted)}
.cat{font-size:.68rem;color:var(--muted);flex:0 0 auto}
.mini{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;padding:3px 7px;font-size:.72rem}
.empty{color:var(--muted);font-size:.83rem;padding:8px 2px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.daychip{flex:0 0 auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:.72rem;min-width:64px}
.daychip .d{font-weight:700;color:var(--text)}
.daychip .n{color:var(--muted);display:block;margin-top:2px;font-size:.68rem}
.addbar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.addbar input[type=text]{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:.85rem}
select{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:.8rem}
.primary{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600}
.subject{margin-bottom:16px}
.subject-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.subject-head h3{font-size:.92rem;margin:0}
.subject-head .pct{font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:10px}
.bar>div{height:100%;background:var(--success);transition:width .3s}
.topic{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.topic-top{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.topic-top .tname{font-size:.84rem;font-weight:500}
.overall-pill{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--border)}
.substat{display:flex;gap:10px;margin-top:5px;font-size:.66rem;color:var(--muted)}
.subtopics{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.subrow{display:flex;align-items:center;gap:10px;padding:7px 0;flex-wrap:wrap;font-size:.78rem;border-bottom:1px dashed var(--border)}
.subrow:last-child{border-bottom:none}
.subrow .sname{flex:1;min-width:160px}
.subrow label{display:flex;align-items:center;gap:4px;font-size:.68rem;color:var(--muted);white-space:nowrap}
.subrow input[type=checkbox]{width:15px;height:15px}
.revbtn{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:.68rem;white-space:nowrap}
.revbtn.r1{color:var(--warning);border-color:var(--warning)}
.revbtn.r2plus{color:var(--success);border-color:var(--success)}
.notesbox{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:.78rem;font-family:inherit;resize:vertical;min-height:44px}
.notes-label{font-size:.66rem;color:var(--muted);margin-top:8px;display:block}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calcell{aspect-ratio:1;border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:.72rem;position:relative;cursor:pointer;background:var(--surface)}
.calcell.other{visibility:hidden}
.calcell.today{border-color:var(--primary);font-weight:700}
.calcell.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.calcell .dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}
.calcell.sel .dot{background:#fff}
.papertabs{display:flex;gap:6px;margin-bottom:10px}
.papertab{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 16px;font-size:.8rem;font-weight:600}
.papertab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.bottomnav{display:none}
@media (max-width:760px){
  .sidebar{display:none}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .main{padding:16px 14px 90px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:5}
  .bottomnav button{background:none;border:none;color:var(--muted);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px}
  .bottomnav button.active{color:var(--primary)}
}
</style>
</head>

<script>
/* ---------- DB LAYER ---------- */
const DB = new Promise((res,rej)=>{
  const r = indexedDB.open('sidharthos',7);
  r.onupgradeneeded = e=>{
    const db=e.target.result;
    if(!db.objectStoreNames.contains('tasks')) db.createObjectStore('tasks',{keyPath:'id'});
    if(!db.objectStoreNames.contains('gateTopics')) db.createObjectStore('gateTopics',{keyPath:'id'});
    if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
    if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'});
    if(!db.objectStoreNames.contains('mistakes')) db.createObjectStore('mistakes',{keyPath:'id'});
    if(!db.objectStoreNames.contains('studySessions')) db.createObjectStore('studySessions',{keyPath:'id'});
    if(!db.objectStoreNames.contains('pyqRecords')) db.createObjectStore('pyqRecords',{keyPath:'id'});
    if(!db.objectStoreNames.contains('internships')) db.createObjectStore('internships',{keyPath:'id'});
    if(!db.objectStoreNames.contains('universities')) db.createObjectStore('universities',{keyPath:'id'});
    if(!db.objectStoreNames.contains('skills')) db.createObjectStore('skills',{keyPath:'id'});
    if(!db.objectStoreNames.contains('resumeEntries')) db.createObjectStore('resumeEntries',{keyPath:'id'});
    if(!db.objectStoreNames.contains('events')) db.createObjectStore('events',{keyPath:'id'});
    if(!db.objectStoreNames.contains('resources')) db.createObjectStore('resources',{keyPath:'id'});
    if(!db.objectStoreNames.contains('documents')) db.createObjectStore('documents',{keyPath:'id'});
    if(!db.objectStoreNames.contains('notes')) db.createObjectStore('notes',{keyPath:'id'});
    if(!db.objectStoreNames.contains('achievements')) db.createObjectStore('achievements',{keyPath:'id'});
  };
  r.onsuccess=e=>res(e.target.result);
  r.onerror=e=>rej(e);
});
async function idbAll(store){const db=await DB;return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const rq=tx.objectStore(store).getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function idbPut(store,val){const db=await DB;return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbDel(store,key){const db=await DB;return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbGet(store,key){const db=await DB;return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const rq=tx.objectStore(store).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}

/* ---------- GATE GA SYLLABUS (General Aptitude — common to every paper) ---------- */
const GATE_GA_SYLLABUS = {
"General Aptitude":{
  "Verbal Aptitude":["Basic English grammar: tenses, articles, adjectives, prepositions, conjunctions, verb-noun agreement","Basic vocabulary: words, idioms, phrases in context","Reading and comprehension, narrative sequencing"],
  "Quantitative Aptitude":["Data interpretation: bar/pie graphs, 2D/3D plots, maps, tables","Numerical computation: ratios, percentages, powers, logs, permutations/combinations, series","Mensuration and geometry; elementary statistics and probability"],
  "Analytical Aptitude":["Logic: deduction and induction","Analogy","Numerical relations and reasoning"],
  "Spatial Aptitude":["Transformation of shapes: translation, rotation, scaling, mirroring","Assembling and grouping","Paper folding, cutting, patterns in 2D and 3D"]
}
};

const SYLLABI = {ME:GATE_ME_SYLLABUS, RA:GATE_RA_SYLLABUS, GA:GATE_GA_SYLLABUS};
let gatePaper = 'ME';

async function ensurePaperSeeded(paper){
  const flagKey = 'gateSeeded_'+paper;
  const done = await idbGet('meta',flagKey);
  if(done) return;
  const existing = await idbAll('gateTopics');
  if(existing.some(t=>t.paper===paper)){ await idbPut('meta',{key:flagKey,value:true}); return; }
  const syllabus = SYLLABI[paper];
  for(const subject in syllabus){
    for(const topic in syllabus[subject]){
      const subtopics = syllabus[subject][topic].map(n=>({n,s:false,p:false,r:0}));
      await idbPut('gateTopics',{id:paper.toLowerCase()+'-'+subject+'-'+topic,paper,subject,topic,subtopics,notes:''});
    }
  }
  await idbPut('meta',{key:flagKey,value:true});
}

async function ensureGateSeeded(){
  const v2 = await idbGet('meta','gateSchemaV2');
  if(v2) return;
  const db = await DB;
  await new Promise((res,rej)=>{const tx=db.transaction('gateTopics','readwrite');tx.objectStore('gateTopics').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
  await idbPut('meta',{key:'gateSchemaV2',value:true});
}

/* ---------- GATE 91-DAY SCHEDULE (from your Prep Tracker workbook, 1 Oct – 30 Dec 2026) ---------- */
const SCHED_SUBJ = {EM:'Engineering Mathematics',AMD:'Applied Mechanics & Design',FMTS:'Fluid Mechanics & Thermal Sciences',MMIE:'Materials, Manufacturing & Industrial Engg',REV:'Revision / Mock Test',BUF:'Buffer / Catch-up'};
// [day,date,subjCode,topic (or, for buffer days, the "if ahead" clause),ga (or, for buffer days, the spaced-retrieval target),mainHrs,gaHrs,kind: s=study b=buffer t=sectional-test m=mock/revision
const SCHEDULE_91 = [
[1,'2026-10-01','EM','Linear Algebra: matrix algebra, systems of linear equations, eigenvalues & eigenvectors','Verbal: grammar & tenses',3.75,0.75,'s'],

async function importGateSchedule(){
  for(const [day,date,subjCode,topic,ga,mainHrs,gaHrs,kind] of SCHEDULE_91){
    const subj = SCHED_SUBJ[subjCode]||subjCode;
    const isTest = kind==='t'||kind==='m';
    await idbPut('tasks',{
      id:'gs-'+day, text:`Day ${day} · ${subj}: ${topic}`, category:'gate',
      priority: isTest?'high':(kind==='b'?'low':'medium'),
      date, done:false, projectId:null, createdAt:new Date().toISOString(),
      estimatedMinutes:Math.round((mainHrs+gaHrs)*60), gaFocus:ga, gateKind:kind
    });
  }
  await idbPut('meta',{key:'scheduleImported',value:true});
}

/* ---------- CALCULATIONS (kept separate from rendering) ---------- */
function topicStats(t){
  const subs=t.subtopics||[]; const n=subs.length||1;
  const studied=subs.filter(s=>s.s).length, pyq=subs.filter(s=>s.p).length, revSum=subs.reduce((a,s)=>a+s.r,0);
  const theory=Math.round(studied/n*100), pyqPct=Math.round(pyq/n*100), revision=Math.round(Math.min(1,revSum/(n*2))*100);
  return {theory,pyqPct,revision,overall:Math.round((theory+pyqPct+revision)/3)};
}
function todayStr(d=new Date()){ const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function priorityRank(p){ return {urgent:0,high:1,medium:2,low:3}[p] ?? 2; }

function getBacklog(tasks){ const t=todayStr(); return tasks.filter(x=>!x.done && x.date && x.date<t).sort((a,b)=>a.date<b.date?-1:1); }
function getTodayTasks(tasks){ const t=todayStr(); return tasks.filter(x=>x.date===t); }
function getUpcoming(tasks,days=7){ const t=todayStr(); const end=addDays(t,days); return tasks.filter(x=>!x.done && x.date>t && x.date<=end).sort((a,b)=>a.date<b.date?-1:1); }
function pickFocus(tasks){
  const today=getTodayTasks(tasks).filter(x=>!x.done);
  const backlog=getBacklog(tasks);
  const pool = today.length? today.map(t=>({t,reason:"Highest-priority incomplete task scheduled today."})) :
               backlog.length? backlog.map(t=>({t,reason:"Overdue since "+t.date+" — nothing else is scheduled today."})) : [];
  if(!pool.length) return null;
  pool.sort((a,b)=>priorityRank(a.t.priority)-priorityRank(b.t.priority));
  return pool[0];
}
function projStats(tasks,pid){ const ts=tasks.filter(t=>t.projectId===pid); const done=ts.filter(t=>t.done).length; return {total:ts.length,done,pct:ts.length?Math.round(done/ts.length*100):0}; }

  const doneToday = todayTasks.filter(x=>x.done).length;
  const backlog = getBacklog(tasks);
  const upcoming = getUpcoming(tasks,7);

  const gateAvg = (()=>{ const me=gate.filter(x=>x.paper==='ME'); return me.length? Math.round(me.reduce((s,x)=>s+topicStats(x).overall,0)/me.length) : 0; })();

async function exportAllData(){
  const data={};
  for(const s of ALL_STORES) data[s]=await idbAll(s);
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='sidharth-os-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
async function importAllData(file){
  const text = await file.text();
  let data; try{ data=JSON.parse(text); }catch(e){ alert('That file is not a valid backup.'); return; }
  for(const s of ALL_STORES){ if(Array.isArray(data[s])){ for(const rec of data[s]) await idbPut(s,rec); } }
}

function revClass(r){ return r<=0?'':r===1?'r1':'r2plus'; }

async function renderGate(){
  await ensureGateSeeded();
  await ensurePaperSeeded(gatePaper);
  const allTopics = await idbAll('gateTopics');
  const topics = allTopics.filter(t=>t.paper===gatePaper);
  const scheduleImported = await idbGet('meta','scheduleImported');
  const bySubject = {};
  topics.forEach(t=>{ (bySubject[t.subject]=bySubject[t.subject]||[]).push(t); });
  const overallAvg = topics.length? Math.round(topics.reduce((s,x)=>s+topicStats(x).overall,0)/topics.length):0;

  const tabs = `<div class="papertabs">${['ME','RA','GA'].map(p=>`<button class="papertab ${p===gatePaper?'active':''}" data-act="switch-paper" data-paper="${p}">${p}</button>`).join('')}</div>`;

  let scheduleBlock = '';
  if(gatePaper==='ME'){
    if(!scheduleImported){
      scheduleBlock = `<div class="card" style="margin-bottom:18px">
        <h3 style="margin:0 0 4px">91-day schedule not imported yet</h3>
        <div class="cat">Your Prep Tracker workbook (1 Oct – 30 Dec 2026, sectional tests, buffer days) hasn't been loaded into Today/Calendar yet.</div>
        <button class="primary" style="margin-top:10px" data-act="import-schedule">Import 91-Day Schedule</button>
      </div>`;
    } else {
      const allTasks = await idbAll('tasks');
      const schedTasks = allTasks.filter(t=>t.id&&t.id.startsWith('gs-'));
      const doneCount = schedTasks.filter(t=>t.done).length;
      scheduleBlock = `<div class="card" style="margin-bottom:18px">
        <div class="substat">Schedule imported: ${doneCount}/${schedTasks.length} days complete. Days appear in Today and Calendar — mark them done as you study.</div>
      </div>`;
    }
  }

  let html = `<h1>GATE 2027 — ${gatePaper}</h1>${tabs}<div class="date">Overall syllabus progress: ${overallAvg}% · click a topic to open its subtopics</div>`;
  html += scheduleBlock;
  for(const subject in bySubject){
    const ts = bySubject[subject];
    const avg = Math.round(ts.reduce((s,x)=>s+topicStats(x).overall,0)/ts.length);
    html += `<div class="subject">
      <div class="subject-head"><h3>${esc(subject)}</h3><span class="pct">${avg}%</span></div>
      <div class="bar"><div style="width:${avg}%"></div></div>
      ${ts.map(t=>{
        const st=topicStats(t); const open=gateExpanded.has(t.id);
        return `<div class="topic">
          <div class="topic-top" data-act="toggle-topic" data-id="${t.id}">
            <span class="tname">${open?'▾':'▸'} ${esc(t.topic)}</span>
            <span class="overall-pill">${st.overall}%</span>
          </div>
          <div class="substat">Theory ${st.theory}% · PYQs ${st.pyqPct}% · Revision ${st.revision}%</div>
          ${open?`<div class="subtopics">
            ${t.subtopics.map((s,i)=>`
              <div class="subrow">
                <span class="sname">${esc(s.n)}</span>
                <label><input type="checkbox" data-act="sub-toggle" data-kind="s" data-id="${t.id}" data-si="${i}" ${s.s?'checked':''}> Studied</label>
                <label><input type="checkbox" data-act="sub-toggle" data-kind="p" data-id="${t.id}" data-si="${i}" ${s.p?'checked':''}> PYQ done</label>
                <button class="revbtn ${revClass(s.r)}" data-act="sub-rev" data-id="${t.id}" data-si="${i}">Rev ×${s.r}</button>
              </div>`).join('')}
            <label class="notes-label">Notes for ${esc(t.topic)}</label>
            <textarea class="notesbox" data-act="topic-notes" data-id="${t.id}" placeholder="Formulas, tricky points, doubts...">${esc(t.notes||'')}</textarea>
          </div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }
  html += renderRevisionQueue(topics);
  html += await renderPyqAnalytics(topics);
  html += await renderMistakeLog();
  return html;
}

function renderRevisionQueue(topics){
  const due=[];
  topics.forEach(t=>t.subtopics.forEach((s,i)=>{ if(s.s && s.r<2) due.push({t,s,i}); }));
  due.sort((a,b)=>a.s.r-b.s.r);
  const rows = due.slice(0,10).map(d=>`<div class="subrow">
    <span class="sname">${esc(d.t.topic)} — ${esc(d.s.n)} <span class="cat">(${esc(d.t.subject)})</span></span>
    <button class="revbtn ${revClass(d.s.r)}" data-act="sub-rev" data-id="${d.t.id}" data-si="${d.i}">Rev ×${d.s.r}</button>
  </div>`).join('');
  return `<div class="section"><h2>Revision due (${due.length})</h2><div class="card">${due.length?rows:'<div class="empty">Nothing studied yet needs revision.</div>'}</div></div>`;
}

async function renderPyqAnalytics(topics){
  const all = await idbAll('pyqRecords');
  const records = all.filter(r=>r.paper===gatePaper);
  const totalAtt = records.reduce((a,r)=>a+r.attempted,0), totalCorr = records.reduce((a,r)=>a+r.correct,0);
  const accuracy = totalAtt? Math.round(totalCorr/totalAtt*100):0;
  const bySubj={};
  records.forEach(r=>{ (bySubj[r.subject]=bySubj[r.subject]||{att:0,corr:0}); bySubj[r.subject].att+=r.attempted; bySubj[r.subject].corr+=r.correct; });
  const subjRows = Object.keys(bySubj).map(s=>{ const d=bySubj[s]; const pct=d.att?Math.round(d.corr/d.att*100):0; return {s,pct,att:d.att}; }).sort((a,b)=>a.pct-b.pct);
  const subjOpts = Object.keys(SYLLABI[gatePaper]).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');

  return `<div class="section"><h2>PYQ accuracy — ${gatePaper}</h2>
    <div class="card">
      <div class="grid4" style="margin-bottom:0">
        <div class="metric"><div class="n">${totalAtt}</div><div class="l">Attempted</div></div>
        <div class="metric"><div class="n">${accuracy}%</div><div class="l">Accuracy</div></div>
      </div>
      ${subjRows.length?subjRows.map(r=>`<div class="substat" style="margin-top:8px">${esc(r.s)}: ${r.pct}% (${r.att} attempted)${r.pct<60?' — needs work':''}</div>`).join(''):'<div class="empty" style="margin-top:8px">No PYQ sessions logged yet for this paper.</div>'}
      <div class="addbar" style="margin-top:12px">
        <select id="pySubj">${subjOpts}</select>
        <input type="text" id="pyTopic" placeholder="Topic">
        <input type="number" id="pyYear" placeholder="Year" style="width:70px">
      </div>
      <div class="addbar">
        <input type="number" id="pyAtt" placeholder="Attempted" style="width:90px">
        <input type="number" id="pyCorr" placeholder="Correct" style="width:90px">
        <button class="primary" id="pyAddBtn">Log PYQ set</button>
      </div>
    </div>
  </div>`;
}

async function renderMistakeLog(){
  const all = await idbAll('mistakes');
  const mistakes = all.filter(m=>(m.paper||'ME')===gatePaper);
  mistakes.sort((a,b)=> (a.resolved-b.resolved) || (b.date>a.date?1:-1) );
  const types = ['concept gap','formula forgotten','calculation','sign error','misread','time pressure','guess','carelessness','other'];
  const subjOpts = Object.keys(SYLLABI[gatePaper]).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');

  const row = m=>`<div class="topic">

const ACH_TYPES = ['Competition','Certification','Internship','Project','Presentation','Publication','Academic','Award','Other'];

async function renderAchievements(){
  const achievements = await idbAll('achievements');
  const projects = await idbAll('projects');
  const timeline = [
    ...achievements.map(a=>({date:a.date,label:`${a.title}${a.organization?' — '+a.organization:''}`,tag:a.atype})),
    ...projects.flatMap(p=>(p.changelog||[]).map(c=>({date:c.date,label:`${p.name}: ${c.title}`,tag:'Project'})))
  ].filter(x=>x.date).sort((a,b)=>b.date<a.date?-1:1);

  const timelineHtml = timeline.length ? timeline.slice(0,15).map(x=>`<div class="subrow"><span class="sname">${esc(x.date)} — ${esc(x.label)} <span class="cat">(${esc(x.tag)})</span></span></div>`).join('') : '<div class="empty">Nothing dated yet — log an achievement or a project changelog entry.</div>';

  const rows = achievements.map(a=>`<div class="topic">
    <div class="topic-top">
      <span class="tname">${esc(a.title)} <span class="cat">(${esc(a.atype)})</span></span>
      <span class="overall-pill">${esc(a.date||'')}</span>
    </div>
    ${a.organization?`<div class="substat">${esc(a.organization)}</div>`:''}
    ${a.description?`<div class="substat">${esc(a.description)}</div>`:''}
    <button class="mini" data-act="ach-del" data-id="${a.id}" style="margin-top:6px">Remove</button>
  </div>`).join('');
  const typeOpts = ACH_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('');

  return `<div class="section"><h2>Timeline</h2><div class="card">${timelineHtml}</div></div>
  <div class="section"><h2>Achievements</h2>
    <div class="section">${achievements.length?rows:'<div class="empty">No achievements logged yet.</div>'}</div>
    <div class="card">
      <div class="addbar">
        <input type="text" id="achTitle" placeholder="Title">
        <select id="achType">${typeOpts}</select>
        <input type="date" id="achDate">
      </div>
      <div class="addbar">
        <input type="text" id="achOrg" placeholder="Organization (optional)">
        <input type="text" id="achDesc" placeholder="Description (optional)">
        <button class="primary" id="achAddBtn">Add</button>
      </div>
    </div>
  </div>`;
}

async function renderProjects(){
  const projects = await idbAll('projects');
  const tasks = await idbAll('tasks');
  const order=['active','planned','idea','paused','completed','archived'];
  projects.sort((a,b)=>order.indexOf(a.status)-order.indexOf(b.status));

  let html = `<h1>Projects</h1><div class="date">${projects.length} project${projects.length===1?'':'s'}</div>`;
  html += projects.length ? projects.map(p=>{
    const st = projStats(tasks,p.id); const open = openProjectId===p.id;
    const ptasks = tasks.filter(t=>t.projectId===p.id);
    if(open){ CURRENT_ADD_DATE = todayStr(); CURRENT_ADD_PROJECT = p.id; }
    return `<div class="topic">
      <div class="topic-top" data-act="toggle-proj" data-id="${p.id}">
        <span class="tname">${open?'▾':'▸'} ${esc(p.name)} <span class="cat">(${p.status})</span></span>
        <span class="overall-pill">${st.pct}%</span>
      </div>
      ${p.description?`<div class="cat" style="margin-top:4px">${esc(p.description)}</div>`:''}
      <div class="bar" style="margin-top:8px"><div style="width:${st.pct}%"></div></div>
      <div class="substat">${st.done}/${st.total} linked tasks done${p.targetDate?' · target '+p.targetDate:''}</div>
      ${open?`<div class="subtopics">
        ${taskRowsHtml(ptasks)}
        ${addFormHtml()}
        <label class="notes-label">Changelog</label>
        ${(p.changelog&&p.changelog.length) ? p.changelog.slice().reverse().map(c=>`<div class="subrow"><span class="sname">${esc(c.date)} — ${esc(c.title)}${c.desc?' · '+esc(c.desc):''}</span></div>`).join('') : '<div class="empty">No changelog entries yet.</div>'}
        <div class="addbar">
          <input type="text" id="clTitle" placeholder="What changed?">
          <input type="text" id="clDesc" placeholder="Details (optional)">
          <button class="mini" data-act="add-changelog" data-id="${p.id}">Log update</button>
        </div>
        <button class="mini" data-act="del-proj" data-id="${p.id}" style="margin-top:8px;color:var(--danger);border-color:var(--danger)">Delete project</button>
      </div>`:''}
    </div>`;
  }).join('') : '<div class="empty">No active projects yet. Create one below.</div>';

  html += `<div class="section"><h2>New project</h2><div class="card"><div class="addbar">
    <input type="text" id="newProjName" placeholder="Project name">
    <select id="newProjStatus"><option value="idea">Idea</option><option value="planned">Planned</option><option value="active" selected>Active</option></select>
    <input type="date" id="newProjTarget">
    <button class="primary" id="addProjBtn">Create</button>
  </div></div></div>`;
  return html;
}

async function renderCalendar(){
  const tasks = await idbAll('tasks');
  const year=calMonth.getFullYear(), month=calMonth.getMonth();
  const startDow = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const monthLabel = calMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const pendingDates = new Set(tasks.filter(t=>!t.done).map(t=>t.date));

  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="calcell other"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds = todayStr(new Date(year,month,d));
    cells+=`<div class="calcell ${ds===todayStr()?'today':''} ${ds===calSelected?'sel':''}" data-act="pick-day" data-date="${ds}">${d}${pendingDates.has(ds)?'<span class="dot"></span>':''}</div>`;
  }
  CURRENT_ADD_DATE = calSelected; CURRENT_ADD_PROJECT = null;
  const dayTasks = tasks.filter(t=>t.date===calSelected);

  return `
  <h1>Calendar</h1>
  <div class="calnav">
    <button class="mini" data-act="cal-prev">Prev</button>
    <div class="date" style="margin:0">${monthLabel}</div>
    <button class="mini" data-act="cal-next">Next</button>
  </div>
  <div class="calgrid">${cells}</div>
  <div class="section" style="margin-top:16px"><h2>${calSelected}${calSelected===todayStr()?' · today':''}</h2>
    <div class="card">${taskRowsHtml(dayTasks)}${addFormHtml()}</div>
  </div>`;
}

/* ---------- EVENTS ---------- */
function wireEvents(){
  document.querySelectorAll('[data-act="toggle"]').forEach(el=>el.onchange=async e=>{
    const task = await idbGet('tasks',el.dataset.id); task.done=el.checked; task.completedAt = el.checked?new Date().toISOString():null; await idbPut('tasks',task); render();
  });
  document.querySelectorAll('[data-act="del"]').forEach(el=>el.onclick=async ()=>{ await idbDel('tasks',el.dataset.id); render(); });
  document.querySelectorAll('[data-act="push"]').forEach(el=>el.onclick=async ()=>{ const task=await idbGet('tasks',el.dataset.id); task.date=addDays(task.date,1); await idbPut('tasks',task); render(); });
  document.querySelectorAll('[data-act="movetoday"]').forEach(el=>el.onclick=async ()=>{ const task=await idbGet('tasks',el.dataset.id); task.date=todayStr(); await idbPut('tasks',task); render(); });
  document.querySelectorAll('[data-act="complete-focus"]').forEach(el=>el.onclick=async ()=>{ const task=await idbGet('tasks',el.dataset.id); task.done=true; task.completedAt=new Date().toISOString(); await idbPut('tasks',task); render(); });
  document.querySelectorAll('[data-act="toggle-topic"]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.id; gateExpanded.has(id)?gateExpanded.delete(id):gateExpanded.add(id); render();
  });
  document.querySelectorAll('[data-act="sub-toggle"]').forEach(el=>el.onchange=async ()=>{
    const t = await idbGet('gateTopics',el.dataset.id); t.subtopics[+el.dataset.si][el.dataset.kind]=el.checked; await idbPut('gateTopics',t); render();
  });
  document.querySelectorAll('[data-act="sub-rev"]').forEach(el=>el.onclick=async ()=>{
    const t = await idbGet('gateTopics',el.dataset.id); const s=t.subtopics[+el.dataset.si]; s.r=(s.r+1)%4; await idbPut('gateTopics',t); render();
  });
  document.querySelectorAll('[data-act="topic-notes"]').forEach(el=>el.onblur=async ()=>{
    const t = await idbGet('gateTopics',el.dataset.id); t.notes=el.value; await idbPut('gateTopics',t);
  });
  const importBtn = document.querySelector('[data-act="import-schedule"]');
  if(importBtn) importBtn.onclick = async ()=>{ importBtn.disabled=true; importBtn.textContent='Importing...'; await importGateSchedule(); render(); };
  document.querySelectorAll('[data-act="switch-paper"]').forEach(el=>el.onclick=()=>{ gatePaper=el.dataset.paper; gateExpanded=new Set(); render(); });
  const pyAddBtn = document.getElementById('pyAddBtn');
  if(pyAddBtn) pyAddBtn.onclick = async ()=>{
    const att=parseInt(document.getElementById('pyAtt').value,10), corr=parseInt(document.getElementById('pyCorr').value,10);
    if(!att || isNaN(corr)) return;
    await idbPut('pyqRecords',{id:'py'+Date.now(),paper:gatePaper,subject:document.getElementById('pySubj').value,topic:document.getElementById('pyTopic').value.trim(),year:document.getElementById('pyYear').value.trim(),attempted:att,correct:Math.min(corr,att),date:todayStr()});
    render();
  };
  document.querySelectorAll('[data-act="mistake-resolve"]').forEach(el=>el.onchange=async ()=>{
    const m = await idbGet('mistakes',el.dataset.id); m.resolved=el.checked; await idbPut('mistakes',m); render();
  });
  document.querySelectorAll('[data-act="mistake-del"]').forEach(el=>el.onclick=async ()=>{ await idbDel('mistakes',el.dataset.id); render(); });
  const mAddBtn = document.getElementById('mAddBtn');
  if(mAddBtn) mAddBtn.onclick = async ()=>{
    const what=document.getElementById('mWhat').value.trim(); if(!what) return;
    await idbPut('mistakes',{id:'m'+Date.now()+Math.random().toString(36).slice(2,6),paper:gatePaper,subject:document.getElementById('mSubj').value,topic:document.getElementById('mTopic').value.trim(),mtype:document.getElementById('mType').value,what,correct:document.getElementById('mCorrect').value.trim(),date:todayStr(),resolved:false});
    render();
  };
  document.querySelectorAll('[data-act="toggle-proj"]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.id; openProjectId = (openProjectId===id)?null:id; render();
  });
  document.querySelectorAll('[data-act="del-proj"]').forEach(el=>el.onclick=async ()=>{
    const tasks = await idbAll('tasks');
    for(const t of tasks){ if(t.projectId===el.dataset.id){ t.projectId=null; await idbPut('tasks',t); } }
    await idbDel('projects',el.dataset.id); render();
  });
  const addProjBtn = document.getElementById('addProjBtn');
  if(addProjBtn) addProjBtn.onclick = async ()=>{
    const name = document.getElementById('newProjName').value.trim(); if(!name) return;
    await idbPut('projects',{id:'p'+Date.now()+Math.random().toString(36).slice(2,6),name,status:document.getElementById('newProjStatus').value,targetDate:document.getElementById('newProjTarget').value||null,description:'',changelog:[],createdAt:new Date().toISOString()});
    render();
  };
  document.querySelectorAll('[data-act="add-changelog"]').forEach(el=>el.onclick=async ()=>{
    const title=document.getElementById('clTitle').value.trim(); if(!title) return;
    const p = await idbGet('projects',el.dataset.id); p.changelog=p.changelog||[];
    p.changelog.push({date:todayStr(),title,desc:document.getElementById('clDesc').value.trim()});
    await idbPut('projects',p); render();
  });
  const tStart=document.querySelector('[data-act="timer-start"]'); if(tStart) tStart.onclick=()=>{ TIMER.running=true; TIMER.startedAt=Date.now(); render(); };
  const tPause=document.querySelector('[data-act="timer-pause"]'); if(tPause) tPause.onclick=()=>{ TIMER.elapsedBase+=Date.now()-TIMER.startedAt; TIMER.running=false; render(); };
  const tComplete=document.querySelector('[data-act="timer-complete"]'); if(tComplete) tComplete.onclick=()=>{ if(TIMER.running){TIMER.elapsedBase+=Date.now()-TIMER.startedAt; TIMER.running=false;} showTimerLogForm=true; render(); };
  const tReset=document.querySelector('[data-act="timer-reset"]'); if(tReset) tReset.onclick=()=>{ TIMER={running:false,startedAt:null,elapsedBase:0}; showTimerLogForm=false; render(); };
  const tDiscard=document.querySelector('[data-act="timer-discard"]'); if(tDiscard) tDiscard.onclick=()=>{ showTimerLogForm=false; render(); };
  const tSave=document.querySelector('[data-act="timer-save"]'); if(tSave) tSave.onclick=async ()=>{
    const durationMin = Math.max(1,Math.round(timerElapsedSec()/60));
    await idbPut('studySessions',{id:'ss'+Date.now(),date:todayStr(),category:document.getElementById('sessCat').value,what:document.getElementById('sessWhat').value.trim(),durationMin,createdAt:new Date().toISOString()});
    TIMER={running:false,startedAt:null,elapsedBase:0}; showTimerLogForm=false; render();

  const calNext = document.querySelector('[data-act="cal-next"]'); if(calNext) calNext.onclick=()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1); render(); };

  document.querySelectorAll('[data-act="intern-del"]').forEach(el=>el.onclick=async ()=>{ await idbDel('internships',el.dataset.id); render(); });
  const inAddBtn = document.getElementById('inAddBtn');
  if(inAddBtn) inAddBtn.onclick = async ()=>{
    const company=document.getElementById('inCompany').value.trim(); if(!company) return;
    await idbPut('internships',{id:'in'+Date.now(),company,role:document.getElementById('inRole').value.trim(),status:document.getElementById('inStatus').value,type:document.getElementById('inType').value.trim(),location:document.getElementById('inLocation').value.trim(),startDate:document.getElementById('inStart').value||null,createdAt:new Date().toISOString()});
    render();
  };
  document.querySelectorAll('[data-act="toggle-uni"]').forEach(el=>el.onclick=()=>{ openUniId=(openUniId===el.dataset.id)?null:el.dataset.id; render(); });
  document.querySelectorAll('[data-act="uni-check"]').forEach(el=>el.onchange=async ()=>{ const u=await idbGet('universities',el.dataset.id); u.checklist=u.checklist||{}; u.checklist[el.dataset.key]=el.checked; await idbPut('universities',u); render(); });
  document.querySelectorAll('[data-act="uni-del"]').forEach(el=>el.onclick=async ()=>{ await idbDel('universities',el.dataset.id); render(); });
  const uAddBtn = document.getElementById('uAddBtn');

    const name=document.getElementById('uName').value.trim(); if(!name) return;
    await idbPut('universities',{id:'u'+Date.now(),name,country:document.getElementById('uCountry').value.trim(),program:document.getElementById('uProgram').value.trim(),deadline:document.getElementById('uDeadline').value||null,checklist:{},createdAt:new Date().toISOString()});

  const impFile = document.getElementById('importFile');
  if(impFile) impFile.onchange = async ()=>{
    const file = impFile.files[0]; if(!file) return;
    if(confirm('This will overwrite any records with matching IDs from the backup. Continue?')){
      await importAllData(file); render();
    }
    impFile.value='';
  };
}
