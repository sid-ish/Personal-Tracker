<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidharth OS — Command Centre</title>
<style>
:root{
  --bg:#F5F7FA;--surface:#fff;--elevated:#fff;--text:#14161c;--muted:#6b7280;--border:#e5e7eb;
  --primary:#6366F1;--secondary:#8B5CF6;--accent:#06B6D4;--success:#22C55E;--warning:#F59E0B;--danger:#EF4444;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0B0D12;--surface:#11151D;--elevated:#171C26;--text:#eceef2;--muted:#9aa1ad;--border:#232838;}
}
:root[data-theme="dark"]{--bg:#0B0D12;--surface:#11151D;--elevated:#171C26;--text:#eceef2;--muted:#9aa1ad;--border:#232838;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;height:100%}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:200px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:1rem;padding:4px 10px 16px}
.brand span{display:block;font-size:.68rem;color:var(--muted);font-weight:400}
.navbtn{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--muted);text-align:left;font-size:.85rem}
.navbtn.active{background:var(--primary);color:#fff}
.navbtn:hover:not(.active){background:var(--elevated);color:var(--text)}
.main{flex:1;min-width:0;padding:20px 24px 90px;max-width:920px;margin:0 auto;width:100%}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.8rem}
h1{font-size:1.4rem;margin:2px 0 2px;letter-spacing:-.01em}
.date{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.metric .n{font-size:1.5rem;font-weight:700}
.metric .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.section{margin-bottom:20px}
.section h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;font-weight:600}
.focus-card{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:16px;padding:18px 20px;border:none}
.focus-card .tag{font-size:.68rem;opacity:.85;letter-spacing:.05em;text-transform:uppercase}
.focus-card h3{margin:6px 0 2px;font-size:1.15rem}
.focus-card p{margin:0 0 12px;opacity:.9;font-size:.85rem}
.focus-card .why{font-size:.72rem;opacity:.75;margin-top:10px}
.focus-empty{color:var(--muted);font-size:.85rem}
.btn{background:#fff;color:var(--primary);border:none;border-radius:8px;padding:7px 14px;font-size:.82rem;font-weight:600}
.task-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-row.done .txt{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary)}
.txt{flex:1;font-size:.87rem}
.pri{font-size:.62rem;padding:2px 7px;border-radius:6px;color:#fff;flex:0 0 auto;text-transform:uppercase}
.pri.urgent{background:var(--danger)}.pri.high{background:var(--warning)}.pri.medium{background:var(--primary)}.pri.low{background:var(--muted)}
.cat{font-size:.68rem;color:var(--muted);flex:0 0 auto}
.mini{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;padding:3px 7px;font-size:.72rem}
.empty{color:var(--muted);font-size:.83rem;padding:8px 2px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.daychip{flex:0 0 auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:.72rem;min-width:64px}
.daychip .d{font-weight:700;color:var(--text)}
.daychip .n{color:var(--muted);display:block;margin-top:2px;font-size:.68rem}
.addbar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.addbar input[type=text]{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:.85rem}
select{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:.8rem}
.primary{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600}
.subject{margin-bottom:16px}
.subject-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.subject-head h3{font-size:.92rem;margin:0}
.subject-head .pct{font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:10px}
.bar>div{height:100%;background:var(--success);transition:width .3s}
.topic{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.topic-top{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.topic-top .tname{font-size:.84rem;font-weight:500}
.overall-pill{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--border)}
.substat{display:flex;gap:10px;margin-top:5px;font-size:.66rem;color:var(--muted)}
.subtopics{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.subrow{display:flex;align-items:center;gap:10px;padding:7px 0;flex-wrap:wrap;font-size:.78rem;border-bottom:1px dashed var(--border)}
.subrow:last-child{border-bottom:none}
.subrow .sname{flex:1;min-width:160px}
.subrow label{display:flex;align-items:center;gap:4px;font-size:.68rem;color:var(--muted);white-space:nowrap}
.subrow input[type=checkbox]{width:15px;height:15px}
.revbtn{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:.68rem;white-space:nowrap}
.revbtn.r1{color:var(--warning);border-color:var(--warning)}
.revbtn.r2plus{color:var(--success);border-color:var(--success)}
.notesbox{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:.78rem;font-family:inherit;resize:vertical;min-height:44px}
.notes-label{font-size:.66rem;color:var(--muted);margin-top:8px;display:block}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calcell{aspect-ratio:1;border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:.72rem;position:relative;cursor:pointer;background:var(--surface)}
.calcell.other{visibility:hidden}
.calcell.today{border-color:var(--primary);font-weight:700}
.calcell.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.calcell .dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}
.calcell.sel .dot{background:#fff}
.bottomnav{display:none}
@media (max-width:760px){
  .sidebar{display:none}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .main{padding:16px 14px 90px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:5}
  .bottomnav button{background:none;border:none;color:var(--muted);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px}
  .bottomnav button.active{color:var(--primary)}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="brand">Sidharth OS<span>Command Centre</span></div>
    <button class="navbtn" data-view="today">Today</button>
    <button class="navbtn" data-view="gate">GATE 2027</button>
    <button class="navbtn" data-view="dashboard">Home</button>
    <button class="navbtn" data-view="projects">Projects</button>
    <button class="navbtn" data-view="calendar">Calendar</button>
  </div>
  <div class="main">
    <div class="topbar">
      <button class="iconbtn" id="themeBtn">Theme</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<div class="bottomnav" id="bottomnav">
  <button data-view="today"><span>Today</span></button>
  <button data-view="gate"><span>GATE</span></button>
  <button data-view="dashboard"><span>Home</span></button>
  <button data-view="projects"><span>Projects</span></button>
  <button data-view="calendar"><span>Calendar</span></button>
</div>

<script>
/* ---------- DB LAYER ---------- */
const DB = new Promise((res,rej)=>{
  const r = indexedDB.open('sidharthos',2);
  r.onupgradeneeded = e=>{
    const db=e.target.result;
    if(!db.objectStoreNames.contains('tasks')) db.createObjectStore('tasks',{keyPath:'id'});
    if(!db.objectStoreNames.contains('gateTopics')) db.createObjectStore('gateTopics',{keyPath:'id'});
    if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
    if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'});
  };
  r.onsuccess=e=>res(e.target.result);
  r.onerror=e=>rej(e);
});
async function idbAll(store){const db=await DB;return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const rq=tx.objectStore(store).getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function idbPut(store,val){const db=await DB;return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbDel(store,key){const db=await DB;return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbGet(store,key){const db=await DB;return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const rq=tx.objectStore(store).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}

/* ---------- GATE ME SYLLABUS (subtopic-level, official GATE 2027 ME syllabus) ---------- */
const GATE_ME_SYLLABUS = {
"Engineering Mathematics":{
  "Linear Algebra":["Matrix algebra","Systems of linear equations","Eigenvalues and eigenvectors"],
  "Calculus":["Limit, continuity, differentiability, mean value theorems","Definite & improper integrals; double/triple integrals","Partial derivatives, Taylor series, maxima/minima, Fourier series","Gradient, divergence, curl; Gauss/Stokes/Green's theorems"],
  "Differential Equations":["First & higher order linear ODEs, Euler-Cauchy equation","Initial and boundary value problems","Laplace transforms","Heat, wave, Laplace's equation solutions"],
  "Complex Variables":["Analytic functions, Cauchy-Riemann equations","Cauchy's integral theorem & formula","Taylor and Laurent series"],
  "Probability and Statistics":["Probability, conditional probability, sampling theorems","Mean, median, mode, standard deviation","Random variables; binomial, Poisson, normal distributions"],
  "Numerical Methods":["Solving linear/non-linear algebraic equations","Trapezoidal & Simpson's rule integration","Single/multi-step methods for ODEs"]
},
"Applied Mechanics and Design":{
  "Engineering Mechanics":["Free-body diagrams and equilibrium","Friction: rolling resistance, belt-pulley, brakes, clutches, screw jack, wedge","Plane trusses and frames; virtual work","Kinematics/dynamics of rigid bodies; impulse-momentum, energy"],
  "Mechanics of Materials":["Stress, strain, elastic constants; Mohr's circle","Thin-walled pressure vessels; SFD & BMD","Bending & shear stresses; shear centre; deflection of beams","Torsion; Euler's column theory; energy methods; thermal stresses","Strain gauges/rosettes; mechanical properties, hardness, impact strength"],
  "Theory of Machines":["Displacement/velocity/acceleration analysis of mechanisms","Dynamic analysis of linkages; cams","Gears and gear trains; flywheels and governors","Balancing of reciprocating/rotating masses; gyroscope"],
  "Vibrations":["Free & forced vibration (1-DOF, 2-DOF); damping","Vibration isolation, transmissibility ratio, resonance","Critical speeds of shafts","Control systems: PID, transfer function"],
  "Machine Design":["Static/dynamic loading; failure theories; fatigue & S-N diagram","Bolted, riveted, welded joints","Shafts, gears, belt drives, bearings, brakes, clutches, springs"]
},
"Fluid Mechanics and Thermal Sciences":{
  "Fluid Mechanics":["Fluid properties, statics, forces on submerged bodies","Control-volume analysis: mass, momentum, energy","Bernoulli's equation; dimensional analysis","Viscous flow, boundary layer, turbulent flow, pipe losses","Compressible flow; converging & converging-diverging nozzles"],
  "Heat Transfer":["Conduction: 1D, resistance concept, fins, unsteady conduction","Convection: boundary layer, dimensionless numbers, correlations","Boiling and condensation","Heat exchangers: LMTD, NTU methods","Radiation: Stefan-Boltzmann, Wien's law, view factors"],
  "Thermodynamics":["Systems, processes, properties of pure substances","Zeroth, first, second laws; work, heat, entropy","Analysis of closed/open systems; property charts","Availability, irreversibility, thermodynamic relations"],
  "Power Engineering & IC Engines":["Vapour and gas power cycles; regeneration, reheat","Otto, Diesel, dual cycles","Air-fuel ratio, equivalence ratio, combustion basics"],
  "Refrigeration and Air-Conditioning":["Vapour and gas refrigeration/heat pump cycles","Properties of moist air, psychrometric chart","Basic psychrometric processes"],
  "Turbomachinery":["Impulse & reaction principles; velocity diagrams","Pelton, Francis, Kaplan turbines; steam & gas turbines","Compressors and pumps; pump characteristics"]
},
"Materials, Manufacturing and Industrial Engineering":{
  "Engineering Materials":["Crystal structure, phase diagrams, heat treatment","Properties of metals, polymers, composites, ceramics","Engineering and true stress-strain diagrams"],
  "Casting, Forming and Joining Processes":["Casting: patterns, moulds, cores, gating/riser design, defects","Plastic deformation, yield criteria; hot/cold working","Bulk & sheet forming; powder metallurgy","Welding, brazing, soldering; solid-state welding; NDT"],
  "Machining and Machine Tool Operations":["Basic machining operations and machine tools","Cutting tools; tool geometry (ASA, ORS); mechanics of machining","Tool materials, tool life, tool wear; economics of machining","Abrasive & non-traditional machining; jigs and fixtures"],
  "Additive Manufacturing":["Principles of AM processes","Advantages, limitations, applications"],
  "Metrology and Inspection":["Limits, fits, tolerances; linear/angular measurement","Comparators, interferometry, form/finish measurement","Alignment/testing methods; tolerance analysis; CMM"],
  "CAD/CAM and Automation":["CAD/CAM concepts and integration","NC/CNC machines and programming","Pneumatic/hydraulic actuators; PLCs"],
  "Production Planning and Control":["Work study, productivity, forecasting","Aggregate planning, scheduling, MRP","Six sigma, lean manufacturing; inventory control; quality/reliability"],
  "Operations Research":["Linear programming, simplex method","Transportation, assignment, network flow models","Queuing models; PERT and CPM"]
}
};

async function ensureGateSeeded(){
  const v2 = await idbGet('meta','gateSchemaV2');
  if(v2) return;
  const db = await DB;
  await new Promise((res,rej)=>{const tx=db.transaction('gateTopics','readwrite');tx.objectStore('gateTopics').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
  for(const subject in GATE_ME_SYLLABUS){
    for(const topic in GATE_ME_SYLLABUS[subject]){
      const subtopics = GATE_ME_SYLLABUS[subject][topic].map(n=>({n,s:false,p:false,r:0}));
      await idbPut('gateTopics',{id:'me-'+subject+'-'+topic,paper:'ME',subject,topic,subtopics,notes:''});
    }
  }
  await idbPut('meta',{key:'gateSchemaV2',value:true});
}

/* ---------- CALCULATIONS (kept separate from rendering) ---------- */
function topicStats(t){
  const subs=t.subtopics||[]; const n=subs.length||1;
  const studied=subs.filter(s=>s.s).length, pyq=subs.filter(s=>s.p).length, revSum=subs.reduce((a,s)=>a+s.r,0);
  const theory=Math.round(studied/n*100), pyqPct=Math.round(pyq/n*100), revision=Math.round(Math.min(1,revSum/(n*2))*100);
  return {theory,pyqPct,revision,overall:Math.round((theory+pyqPct+revision)/3)};
}
function todayStr(d=new Date()){ const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function priorityRank(p){ return {urgent:0,high:1,medium:2,low:3}[p] ?? 2; }

function getBacklog(tasks){ const t=todayStr(); return tasks.filter(x=>!x.done && x.date && x.date<t).sort((a,b)=>a.date<b.date?-1:1); }
function getTodayTasks(tasks){ const t=todayStr(); return tasks.filter(x=>x.date===t); }
function getUpcoming(tasks,days=7){ const t=todayStr(); const end=addDays(t,days); return tasks.filter(x=>!x.done && x.date>t && x.date<=end).sort((a,b)=>a.date<b.date?-1:1); }
function pickFocus(tasks){
  const today=getTodayTasks(tasks).filter(x=>!x.done);
  const backlog=getBacklog(tasks);
  const pool = today.length? today.map(t=>({t,reason:"Highest-priority incomplete task scheduled today."})) :
               backlog.length? backlog.map(t=>({t,reason:"Overdue since "+t.date+" — nothing else is scheduled today."})) : [];
  if(!pool.length) return null;
  pool.sort((a,b)=>priorityRank(a.t.priority)-priorityRank(b.t.priority));
  return pool[0];
}
function projStats(tasks,pid){ const ts=tasks.filter(t=>t.projectId===pid); const done=ts.filter(t=>t.done).length; return {total:ts.length,done,pct:ts.length?Math.round(done/ts.length*100):0}; }

/* ---------- SHARED UI HELPERS ---------- */
let CURRENT_ADD_DATE = todayStr();
let CURRENT_ADD_PROJECT = null;
function taskRowsHtml(list){
  return list.length ? list.map(x=>`
    <div class="task-row ${x.done?'done':''}">
      <input type="checkbox" data-act="toggle" data-id="${x.id}" ${x.done?'checked':''}>
      <span class="pri ${x.priority||'medium'}">${x.priority||'med'}</span>
      <span class="txt">${esc(x.text)}</span>
      <span class="cat">${esc(x.category||'')}${x.date&&x.date!==todayStr()?' · '+x.date:''}</span>
      <button class="mini" data-act="push" data-id="${x.id}">Push</button>
      <button class="mini" data-act="del" data-id="${x.id}">Remove</button>
    </div>`).join('') : '<div class="empty">No tasks here yet.</div>';
}
function addFormHtml(){
  return `<div class="addbar">
    <select id="newCat"><option value="academic">Academic</option><option value="gate">GATE</option><option value="project">Project</option><option value="personal">Personal</option><option value="other">Other</option></select>
    <select id="newPri"><option value="medium" selected>Medium</option><option value="urgent">Urgent</option><option value="high">High</option><option value="low">Low</option></select>
    <input type="text" id="newTxt" placeholder="Add a task...">
    <button class="primary" id="addTaskBtn">Add</button>
  </div>`;
}

/* ---------- STATE / NAV ---------- */
let VIEW='dashboard';
let gateExpanded = new Set();
let calMonth = new Date();
let calSelected = todayStr();
let openProjectId = null;
function setView(v){ VIEW=v; document.querySelectorAll('.navbtn,.bottomnav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v)); render(); }
document.querySelectorAll('.navbtn,.bottomnav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));

const themeOrder=['system','dark','light'];
let themeIdx = themeOrder.indexOf(localStorage.getItem('sos_theme')||'system'); if(themeIdx<0)themeIdx=0;
function applyTheme(){
  const t=themeOrder[themeIdx];
  if(t==='system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('sos_theme',t);
  document.getElementById('themeBtn').textContent = t==='system'?'Auto':(t==='dark'?'Dark':'Light');
}
document.getElementById('themeBtn').onclick=()=>{ themeIdx=(themeIdx+1)%themeOrder.length; applyTheme(); };
applyTheme();

function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- RENDER ---------- */
async function render(){
  const el = document.getElementById('view');
  if(VIEW==='dashboard') el.innerHTML = await renderDashboard();
  if(VIEW==='today') el.innerHTML = await renderToday();
  if(VIEW==='gate') el.innerHTML = await renderGate();
  if(VIEW==='projects') el.innerHTML = await renderProjects();
  if(VIEW==='calendar') el.innerHTML = await renderCalendar();
  wireEvents();
}

async function renderDashboard(){
  const tasks = await idbAll('tasks');
  const gate = await idbAll('gateTopics');
  const t = todayStr();
  const todayTasks = getTodayTasks(tasks);
  const doneToday = todayTasks.filter(x=>x.done).length;
  const backlog = getBacklog(tasks);
  const upcoming = getUpcoming(tasks,7);
  const focus = pickFocus(tasks);
  const gateAvg = gate.length? Math.round(gate.reduce((s,x)=>s+topicStats(x).overall,0)/gate.length) : 0;
  const hr = new Date().getHours();
  const greet = hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const dateLabel = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

  let focusHtml = '<div class="focus-empty">Nothing scheduled or overdue — you\'re clear.</div>';
  if(focus){
    focusHtml = `<div class="focus-card">
      <div class="tag">Focus now</div>
      <h3>${esc(focus.t.text)}</h3>
      <p>${esc(focus.t.category||'task')} · ${esc(focus.t.priority||'medium')} priority</p>
      <button class="btn" data-act="complete-focus" data-id="${focus.t.id}">Mark complete</button>
      <div class="why">${esc(focus.reason)}</div>
    </div>`;
  }

  const upcomingHtml = upcoming.length ? upcoming.map(x=>`<div class="daychip"><span class="d">${x.date.slice(5)}</span><span class="n">${esc(x.text.slice(0,16))}</span></div>`).join('') : '<div class="empty">Nothing in the next 7 days.</div>';

  return `
  <h1>${greet}, Sidharth</h1>
  <div class="date">${dateLabel}</div>
  <div class="grid4">
    <div class="card metric"><div class="n">${doneToday}/${todayTasks.length}</div><div class="l">Today's tasks</div></div>
    <div class="card metric"><div class="n">${backlog.length}</div><div class="l">Overdue</div></div>
    <div class="card metric"><div class="n">${gateAvg}%</div><div class="l">GATE progress</div></div>
    <div class="card metric"><div class="n">${upcoming.length}</div><div class="l">Upcoming (7d)</div></div>
  </div>
  <div class="section">${focusHtml}</div>
  <div class="section"><h2>Upcoming</h2><div class="strip">${upcomingHtml}</div></div>
  <div class="section"><h2>Needs attention</h2>
    ${backlog.length? backlog.slice(0,5).map(x=>`<div class="task-row"><span class="pri ${x.priority||'medium'}">${x.priority||'med'}</span><span class="txt">${esc(x.text)}</span><span class="cat">since ${x.date}</span></div>`).join('') : '<div class="empty">Nothing overdue. Clear board.</div>'}
  </div>`;
}

async function renderToday(){
  const tasks = await idbAll('tasks');
  const today = getTodayTasks(tasks).sort((a,b)=>priorityRank(a.priority)-priorityRank(b.priority));
  const backlog = getBacklog(tasks);
  CURRENT_ADD_DATE = todayStr(); CURRENT_ADD_PROJECT = null;

  const backlogRows = backlog.length ? backlog.map(x=>`
    <div class="task-row">
      <span class="pri ${x.priority||'medium'}">${x.priority||'med'}</span>
      <span class="txt">${esc(x.text)} <span class="cat">(was ${x.date})</span></span>
      <button class="mini" data-act="movetoday" data-id="${x.id}">Move to today</button>
    </div>`).join('') : '<div class="empty">Nothing pending.</div>';

  return `
  <h1>Today</h1>
  <div class="date">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long'})}</div>
  <div class="card section">
    ${taskRowsHtml(today)}
    ${addFormHtml()}
  </div>
  <div class="section"><h2>Backlog</h2><div class="card">${backlogRows}</div></div>`;
}

function revClass(r){ return r<=0?'':r===1?'r1':'r2plus'; }

async function renderGate(){
  await ensureGateSeeded();
  const topics = await idbAll('gateTopics');
  const bySubject = {};
  topics.forEach(t=>{ (bySubject[t.subject]=bySubject[t.subject]||[]).push(t); });
  const overallAvg = topics.length? Math.round(topics.reduce((s,x)=>s+topicStats(x).overall,0)/topics.length):0;

  let html = `<h1>GATE 2027 — ME</h1><div class="date">Overall syllabus progress: ${overallAvg}% · click a topic to open its subtopics</div>`;
  for(const subject in bySubject){
    const ts = bySubject[subject];
    const avg = Math.round(ts.reduce((s,x)=>s+topicStats(x).overall,0)/ts.length);
    html += `<div class="subject">
      <div class="subject-head"><h3>${esc(subject)}</h3><span class="pct">${avg}%</span></div>
      <div class="bar"><div style="width:${avg}%"></div></div>
      ${ts.map(t=>{
        const st=topicStats(t); const open=gateExpanded.has(t.id);
        return `<div class="topic">
          <div class="topic-top" data-act="toggle-topic" data-id="${t.id}">
            <span class="tname">${open?'▾':'▸'} ${esc(t.topic)}</span>
            <span class="overall-pill">${st.overall}%</span>
          </div>
          <div class="substat">Theory ${st.theory}% · PYQs ${st.pyqPct}% · Revision ${st.revision}%</div>
          ${open?`<div class="subtopics">
            ${t.subtopics.map((s,i)=>`
              <div class="subrow">
                <span class="sname">${esc(s.n)}</span>
                <label><input type="checkbox" data-act="sub-toggle" data-kind="s" data-id="${t.id}" data-si="${i}" ${s.s?'checked':''}> Studied</label>
                <label><input type="checkbox" data-act="sub-toggle" data-kind="p" data-id="${t.id}" data-si="${i}" ${s.p?'checked':''}> PYQ done</label>
                <button class="revbtn ${revClass(s.r)}" data-act="sub-rev" data-id="${t.id}" data-si="${i}">Rev ×${s.r}</button>
              </div>`).join('')}
            <label class="notes-label">Notes for ${esc(t.topic)}</label>
            <textarea class="notesbox" data-act="topic-notes" data-id="${t.id}" placeholder="Formulas, tricky points, doubts...">${esc(t.notes||'')}</textarea>
          </div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }
  html += `<div class="empty">GA and RA papers, PYQ analytics, mistake log, revision queue, and mock tests come in the next build.</div>`;
  return html;
}

async function renderProjects(){
  const projects = await idbAll('projects');
  const tasks = await idbAll('tasks');
  const order=['active','planned','idea','paused','completed','archived'];
  projects.sort((a,b)=>order.indexOf(a.status)-order.indexOf(b.status));

  let html = `<h1>Projects</h1><div class="date">${projects.length} project${projects.length===1?'':'s'}</div>`;
  html += projects.length ? projects.map(p=>{
    const st = projStats(tasks,p.id); const open = openProjectId===p.id;
    const ptasks = tasks.filter(t=>t.projectId===p.id);
    if(open){ CURRENT_ADD_DATE = todayStr(); CURRENT_ADD_PROJECT = p.id; }
    return `<div class="topic">
      <div class="topic-top" data-act="toggle-proj" data-id="${p.id}">
        <span class="tname">${open?'▾':'▸'} ${esc(p.name)} <span class="cat">(${p.status})</span></span>
        <span class="overall-pill">${st.pct}%</span>
      </div>
      ${p.description?`<div class="cat" style="margin-top:4px">${esc(p.description)}</div>`:''}
      <div class="bar" style="margin-top:8px"><div style="width:${st.pct}%"></div></div>
      <div class="substat">${st.done}/${st.total} linked tasks done${p.targetDate?' · target '+p.targetDate:''}</div>
      ${open?`<div class="subtopics">
        ${taskRowsHtml(ptasks)}
        ${addFormHtml()}
        <button class="mini" data-act="del-proj" data-id="${p.id}" style="margin-top:8px;color:var(--danger);border-color:var(--danger)">Delete project</button>
      </div>`:''}
    </div>`;
  }).join('') : '<div class="empty">No active projects yet. Create one below.</div>';

  html += `<div class="section"><h2>New project</h2><div class="card"><div class="addbar">
    <input type="text" id="newProjName" placeholder="Project name">
    <select id="newProjStatus"><option value="idea">Idea</option><option value="planned">Planned</option><option value="active" selected>Active</option></select>
    <input type="date" id="newProjTarget">
    <button class="primary" id="addProjBtn">Create</button>
  </div></div></div>`;
  return html;
}

async function renderCalendar(){
  const tasks = await idbAll('tasks');
  const year=calMonth.getFullYear(), month=calMonth.getMonth();
  const startDow = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const monthLabel = calMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const pendingDates = new Set(tasks.filter(t=>!t.done).map(t=>t.date));

  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="calcell other"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds = todayStr(new Date(year,month,d));
    cells+=`<div class="calcell ${ds===todayStr()?'today':''} ${ds===calSelected?'sel':''}" data-act="pick-day" data-date="${ds}">${d}${pendingDates.has(ds)?'<span class="dot"></span>':''}</div>`;
  }
  CURRENT_ADD_DATE = calSelected; CURRENT_ADD_PROJECT = null;
  const dayTasks = tasks.filter(t=>t.date===calSelected);

  return `
  <h1>Calendar</h1>
  <div class="calnav">
    <button class="mini" data-act="cal-prev">Prev</button>
    <div class="date" style="margin:0">${monthLabel}</div>
    <button class="mini" data-act="cal-next">Next</button>
  </div>
  <div class="calgrid">${cells}</div>
  <div class="section" style="margin-top:16px"><h2>${calSelected}${calSelected===todayStr()?' · today':''}</h2>
    <div class="card">${taskRowsHtml(dayTasks)}${addFormHtml()}</div>
  </div>`;
}

/* ---------- EVENTS ---------- */
function wireEvents(){
  document.querySelectorAll('[data-act="toggle"]').forEach(el=>el.onchange=async e=>{
    const task = await idbGet('tasks',el.dataset.id); task.done=el.checked; task.completedAt = el.checked?new Date().toISOString():null; await idbPut('tasks',task); render();
  });
  document.querySelectorAll('[data-act="del"]').forEach(el=>el.onclick=async ()=>{ await idbDel('tasks',el.dataset.id); render(); });
  document.querySelectorAll('[data-act="push"]').forEach(el=>el.onclick=async ()=>{ const task=await idbGet('tasks',el.dataset.id); task.date=addDays(task.date,1); await idbPut('tasks',task); render(); });
  document.querySelectorAll('[data-act="movetoday"]').forEach(el=>el.onclick=async ()=>{ const task=await idbGet('tasks',el.dataset.id); task.date=todayStr(); await idbPut('tasks',task); render(); });
  document.querySelectorAll('[data-act="complete-focus"]').forEach(el=>el.onclick=async ()=>{ const task=await idbGet('tasks',el.dataset.id); task.done=true; task.completedAt=new Date().toISOString(); await idbPut('tasks',task); render(); });
  document.querySelectorAll('[data-act="toggle-topic"]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.id; gateExpanded.has(id)?gateExpanded.delete(id):gateExpanded.add(id); render();
  });
  document.querySelectorAll('[data-act="sub-toggle"]').forEach(el=>el.onchange=async ()=>{
    const t = await idbGet('gateTopics',el.dataset.id); t.subtopics[+el.dataset.si][el.dataset.kind]=el.checked; await idbPut('gateTopics',t); render();
  });
  document.querySelectorAll('[data-act="sub-rev"]').forEach(el=>el.onclick=async ()=>{
    const t = await idbGet('gateTopics',el.dataset.id); const s=t.subtopics[+el.dataset.si]; s.r=(s.r+1)%4; await idbPut('gateTopics',t); render();
  });
  document.querySelectorAll('[data-act="topic-notes"]').forEach(el=>el.onblur=async ()=>{
    const t = await idbGet('gateTopics',el.dataset.id); t.notes=el.value; await idbPut('gateTopics',t);
  });
  document.querySelectorAll('[data-act="toggle-proj"]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.id; openProjectId = (openProjectId===id)?null:id; render();
  });
  document.querySelectorAll('[data-act="del-proj"]').forEach(el=>el.onclick=async ()=>{
    const tasks = await idbAll('tasks');
    for(const t of tasks){ if(t.projectId===el.dataset.id){ t.projectId=null; await idbPut('tasks',t); } }
    await idbDel('projects',el.dataset.id); render();
  });
  const addProjBtn = document.getElementById('addProjBtn');
  if(addProjBtn) addProjBtn.onclick = async ()=>{
    const name = document.getElementById('newProjName').value.trim(); if(!name) return;
    await idbPut('projects',{id:'p'+Date.now()+Math.random().toString(36).slice(2,6),name,status:document.getElementById('newProjStatus').value,targetDate:document.getElementById('newProjTarget').value||null,description:'',createdAt:new Date().toISOString()});
    render();
  };
  document.querySelectorAll('[data-act="pick-day"]').forEach(el=>el.onclick=()=>{ calSelected=el.dataset.date; render(); });
  const calPrev = document.querySelector('[data-act="cal-prev"]'); if(calPrev) calPrev.onclick=()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1); render(); };
  const calNext = document.querySelector('[data-act="cal-next"]'); if(calNext) calNext.onclick=()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1); render(); };
  const addBtn = document.getElementById('addTaskBtn');
  if(addBtn){
    addBtn.onclick = async ()=>{
      const txt=document.getElementById('newTxt').value.trim(); if(!txt) return;
      await idbPut('tasks',{id:'t'+Date.now()+Math.random().toString(36).slice(2,6),text:txt,category:document.getElementById('newCat').value,priority:document.getElementById('newPri').value,date:CURRENT_ADD_DATE,projectId:CURRENT_ADD_PROJECT,done:false,createdAt:new Date().toISOString()});
      document.getElementById('newTxt').value=''; render();
    };
    document.getElementById('newTxt').addEventListener('keydown',e=>{ if(e.key==='Enter') addBtn.click(); });
  }
}

setView('dashboard');
</script>
